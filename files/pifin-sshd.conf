# PiFin SSH hardening. Named 01-… because sshd keeps the first value it reads,
# and cloud-init's 50-cloud-init.conf turns password login on.
# PasswordAuthentication is set below this file by pifin-setup.sh: "no" when the
# user has an authorized key (SSH_PUBKEY), else left on so you aren't locked out.
PermitRootLogin no
AllowUsers @@PIFIN_USER@@
KbdInteractiveAuthentication no
X11Forwarding no
AllowAgentForwarding no
MaxAuthTries 3
LoginGraceTime 20
