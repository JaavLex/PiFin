# PiFin: TV remote (CEC) / air mouse / keyboard while mpv plays
# Keys route through pifin-osd.lua so the overlay can wake, drive menus and seek.
# NOTE: the Lua script's client name is "pifin_osd" (mpv replaces non-alphanumeric
# chars with '_'; local testing on mpv 0.40/0.41 confirmed the dash form is NOT found).
# STOP/HOMEPAGE/CANCEL always quit mpv, even with a menu open.
ENTER      script-binding pifin_osd/toggle-pause
KP_ENTER   script-binding pifin_osd/toggle-pause
SPACE      script-binding pifin_osd/toggle-pause
PLAYPAUSE  script-binding pifin_osd/toggle-pause
LEFT       script-binding pifin_osd/seek-back
RIGHT      script-binding pifin_osd/seek-fwd
REWIND     script-binding pifin_osd/seek-back
FORWARD    script-binding pifin_osd/seek-fwd
PGUP       script-binding pifin_osd/seek-big-fwd
PGDWN      script-binding pifin_osd/seek-big-back
UP         script-binding pifin_osd/open-audio
DOWN       script-binding pifin_osd/open-sub
MENU       script-binding pifin_osd/show-overlay
GO_BACK    script-binding pifin_osd/back
ESC        script-binding pifin_osd/back
BS         script-binding pifin_osd/back
STOP       quit
HOMEPAGE   quit
CANCEL     quit
m          cycle mute
