[package]
name = "pifin"
version = "0.2.0"
edition = "2021"
description = "Lightweight Jellyfin browser for Raspberry Pi; playback is handed to mpv"
license = "MIT"

# Runs as a Wayland client under cage. Video is never rendered here: Play spawns
# the native mpv (hardware decoding, pifin-osd.lua overlay) and the UI idles.
[dependencies]
slint = { version = "1", default-features = false, features = ["std", "compat-1-2", "backend-winit-wayland", "renderer-femtovg"] }
ureq = { version = "3", default-features = false, features = ["json", "rustls"] }  # https servers too
serde = { version = "1", features = ["derive"] }
serde_json = "1"
qrcode = { version = "0.14", default-features = false }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[build-dependencies]
slint-build = "1"

[profile.release]
opt-level = 3
debug = false
strip = true
lto = "thin"
panic = "abort"
